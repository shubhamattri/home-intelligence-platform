{{- if .Values.metrics.serviceMonitor }}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  endpoints:
    - targetPort: {{ $svc.port }}
      path: /metrics
      interval: {{ $root.Values.metrics.interval }}
{{- end }}
{{- end }}
