{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "bhi.labels" (dict "name" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $svc.port }}"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.repository }}/{{ $name }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["sh", "-c", "uv run --no-sync uvicorn {{ $svc.module }} --host 0.0.0.0 --port {{ $svc.port }}"]
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- if $svc.database }}
            - name: DATABASE_URL
              value: {{ include "bhi.databaseUrl" (dict "root" $root "svc" $svc) | quote }}
            {{- end }}
            {{- if $svc.redis }}
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            {{- end }}
            {{- if $svc.orchestrator }}
            - name: REAL_ESTATE_URL
              value: "http://real-estate-svc:8001"
            - name: HOSPITALS_URL
              value: "http://hospitals-svc:8002"
            - name: SCHOOLS_URL
              value: "http://schools-svc:8003"
            {{- end }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ $svc.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "bhi.labels" (dict "name" $name) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
