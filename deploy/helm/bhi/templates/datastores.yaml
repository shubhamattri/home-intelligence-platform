{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
{{- end }}
{{- range $host, $cfg := .Values.postgres }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $host }}
spec:
  serviceName: {{ $host }}
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $host }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $host }} }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: {{ $cfg.user | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ $cfg.password | quote }} }
            - { name: POSTGRES_DB, value: {{ $cfg.db | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $cfg.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $host }}
spec:
  selector: { app.kubernetes.io/name: {{ $host }} }
  ports: [{ port: 5432, targetPort: 5432 }]
{{- end }}
