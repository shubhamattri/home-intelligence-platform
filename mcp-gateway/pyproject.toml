[project]
name = "mcp-gateway"
version = "0.1.0"
description = "MCP server fronting the platform: family home-decision tools for agents"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.28",
    "platform-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]
