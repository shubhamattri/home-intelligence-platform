[project]
name = "bhi-contracts"
version = "0.1.0"
description = "Shared Pydantic v2 request/response contracts across services"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
