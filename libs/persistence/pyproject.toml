[project]
name = "bhi-persistence"
version = "0.1.0"
description = "Async SQLAlchemy engine/session/base shared by services"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/persistence"]
