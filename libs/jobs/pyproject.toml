[project]
name = "bhi-jobs"
version = "0.1.0"
description = "Async job queue: in-memory + Redis adapters, worker, jobs router"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "redis>=5.2",
    "platform-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs"]
