# Alembic config for real_estate_db. The URL is taken from DATABASE_URL at runtime
# (see migrations/env.py); the value here is only a placeholder.
[alembic]
script_location = migrations
sqlalchemy.url = postgresql+asyncpg://bhi:bhi@localhost:5432/real_estate_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
