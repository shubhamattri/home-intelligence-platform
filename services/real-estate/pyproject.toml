[project]
name = "real-estate-svc"
version = "0.1.0"
description = "Real-estate domain service: projects, gate scoring, growth corridors"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "platform-common",
    "service-kit",
    "bhi-contracts",
    "bhi-jobs",
    "bhi-persistence",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/real_estate_svc"]
