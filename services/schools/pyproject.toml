[project]
name = "schools-svc"
version = "0.1.0"
description = "Schools domain service: catalogue and area shortlist"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "platform-common",
    "service-kit",
    "bhi-contracts",
    "bhi-persistence",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schools_svc"]
